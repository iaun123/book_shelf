<!DOCTYPE html>
<html lang="en" data-theme="arcade">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK SHELF</title>
    <meta name="description" content="A retro 8-bit / 16-bit RPG pixel art book shelf & manga collection manager. Track volumes, ongoing series, and read quests.">
    <!-- Retro & Clear Numeral Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Style Sheets -->
    <link rel="stylesheet" href="./style.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Twinkling Pixel Stars Background -->
    <div class="pixel-stars-bg"></div>

    <!-- CRT Scanline Effect -->
    <div id="crt-overlay" class="crt-scanlines"></div>

    <!-- Auth / Login Overlay (Arcade Start Screen) -->
    <div id="login-overlay" class="auth-overlay" role="dialog" aria-labelledby="auth-title">
        <div class="auth-blur-bg"></div>
        <div class="login-card glass-card">
            <div class="login-header">
                <div class="login-logo-container">
                    <i data-lucide="gamepad-2" class="login-logo-icon"></i>
                </div>
                <h2 id="auth-title">★ BOOK SHELF ★</h2>
                <p class="auth-subtitle">&lt; INSERT COIN / PLAYER ACCESS &gt;</p>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label for="auth-email">PLAYER 1 [EMAIL]</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" class="input-icon"></i>
                        <input type="email" id="auth-email" placeholder="hero@pixel.quest" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="auth-password">PASSWORD [PASSCODE]</label>
                    <div class="input-wrapper">
                        <i data-lucide="key" class="input-icon"></i>
                        <input type="password" id="auth-password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" id="login-btn" class="btn btn-primary btn-block">
                    <span>▶ START GAME</span>
                    <i data-lucide="swords"></i>
                </button>
            </form>
            
            <footer class="login-footer">
                <p>⚡ SYNC DIRECTLY TO BOOK_ROWS.CSV</p>
            </footer>
        </div>
    </div>

    <!-- Main App Content (RPG Dashboard) -->
    <div id="app-content" style="display:none;">
        <!-- Top Navigation Bar -->
        <header class="top-nav glass-card">
            <div class="nav-brand" onclick="location.reload();" title="Reset view">
                <i data-lucide="library" class="brand-icon"></i>
                <h1>BOOK SHELF</h1>
            </div>
            
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="> FIND_SERIES...">
            </div>
            
            <div class="user-controls">
                <!-- Theme Switcher Button -->
                <button id="theme-btn" class="btn btn-secondary btn-sm" aria-label="Switch Theme Palette" title="Cycle Console Themes (Arcade / Game Boy / Cyberpunk / SNES)">
                    <i data-lucide="palette"></i>
                    <span id="theme-text">THEME: ARCADE</span>
                </button>

                <!-- Audio SFX Toggle -->
                <button id="sound-btn" class="btn btn-secondary btn-sm" aria-label="Toggle SFX" title="Toggle 8-bit Retro Audio FX">
                    <i data-lucide="volume-2" id="sound-icon"></i>
                    <span id="sound-text">SFX: ON</span>
                </button>

                <!-- CRT Scanline Toggle -->
                <button id="crt-btn" class="btn btn-secondary btn-sm" aria-label="Toggle CRT Scanlines" title="Toggle CRT Screen Scanlines">
                    <i data-lucide="tv"></i>
                    <span id="crt-text">CRT: ON</span>
                </button>

                <!-- CSV Reload -->
                <button id="sync-csv-btn" class="btn btn-secondary btn-sm" aria-label="Reload from CSV" title="Reload fresh data from book_rows.csv">
                    <i data-lucide="refresh-cw"></i>
                    <span>RELOAD</span>
                </button>

                <!-- User Profile Badge -->
                <div class="user-info">
                    <i data-lucide="shield" class="user-icon"></i>
                    <span id="display-user"></span>
                </div>

                <!-- Logout -->
                <button id="logout-btn" class="btn btn-danger-outline btn-sm" aria-label="Sign Out">
                    <i data-lucide="log-out"></i>
                    <span>EXIT</span>
                </button>
            </div>
        </header>

        <!-- Quick Stats HUD Ribbon -->
        <div class="hud-ribbon" id="hud-stats">
            <div class="hud-item">
                <span class="hud-label">📜 TOTAL QUESTS:</span>
                <span class="hud-val" id="hud-total">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">🔥 ONGOING:</span>
                <span class="hud-val" id="hud-ongoing" style="color:var(--pixel-gold-glow);">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">★ CLEARED:</span>
                <span class="hud-val" id="hud-cleared" style="color:var(--pixel-green);">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">💀 DROPPED:</span>
                <span class="hud-val" id="hud-dropped" style="color:var(--pixel-red);">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">🎒 TOTAL VOLUMES:</span>
                <span class="hud-val" id="hud-volumes" style="color:var(--pixel-cyan);">0</span>
            </div>

            <!-- RPG Level & Completion Rate Bar -->
            <div class="hud-exp-container">
                <div class="exp-header">
                    <span class="exp-title">⭐ QUEST CLEAR RATE:</span>
                    <span class="exp-percentage" id="exp-percent-text">0%</span>
                </div>
                <div class="exp-bar-track">
                    <div class="exp-bar-fill" id="exp-bar-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Sidebar Navigation & Add Panel -->
            <aside class="sidebar glass-card">
                <section class="sidebar-section">
                    <h2 class="sidebar-heading">
                        <i data-lucide="scroll" style="width:16px; height:16px;"></i>
                        <span>ARCHIVES</span>
                    </h2>
                    <nav class="nav-menu">
                        <button id="nav-all" class="nav-item active">
                            <i data-lucide="layout-grid"></i>
                            <span>[ ALL SERIES ]</span>
                        </button>
                        <button id="nav-comic" class="nav-item">
                            <i data-lucide="book-open"></i>
                            <span>[ 📜 COMICS ]</span>
                        </button>
                        <button id="nav-novel" class="nav-item">
                            <i data-lucide="book"></i>
                            <span>[ 📖 NOVELS ]</span>
                        </button>
                        <button id="nav-ebook" class="nav-item">
                            <i data-lucide="tablet"></i>
                            <span>[ 🔮 E-BOOKS ]</span>
                        </button>
                    </nav>
                </section>
                
                <hr class="divider">
                
                <!-- Form to Add Book (Forge Panel) -->
                <section class="sidebar-section admin-panel">
                    <h2 class="sidebar-heading">
                        <i data-lucide="anvil" style="width:16px; height:16px;"></i>
                        <span>CRAFT ENTRY</span>
                    </h2>
                    <form id="add-book-form" onsubmit="event.preventDefault();">
                        <div class="form-group">
                            <label for="new-title">SERIES NAME</label>
                            <input type="text" id="new-title" placeholder="e.g. Conan" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="new-vol">VOLUME NO.</label>
                            <input type="text" id="new-vol" placeholder="e.g. 1" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="new-category">CATEGORY</label>
                            <div class="select-wrapper">
                                <select id="new-category">
                                    <option value="Comic">Comic (มังงะ)</option>
                                    <option value="Novel">Novel (นิยาย)</option>
                                    <option value="EBook">E-Book (ดิจิทัล)</option>
                                </select>
                                <i data-lucide="chevron-down" class="select-chevron"></i>
                            </div>
                        </div>

                        <!-- Live Crafting Mini Preview -->
                        <div class="craft-preview-box" id="craft-preview">
                            <div class="craft-preview-label">🛠️ LIVE PREVIEW:</div>
                            <div class="craft-preview-content">
                                <span id="preview-title" class="preview-title">Series Name</span>
                                <span id="preview-meta" class="preview-meta">📜 Comic • Vol 1</span>
                            </div>
                        </div>
                        
                        <button type="button" id="save-btn" class="btn btn-primary btn-block">
                            <i data-lucide="sparkles"></i>
                            <span>FORGE & SAVE</span>
                        </button>
                    </form>
                </section>
            </aside>

            <!-- Main Content Area -->
            <main class="content">
                <div class="content-header">
                    <button id="back-btn" class="btn btn-link back-link" aria-label="Back to List">
                        <i data-lucide="arrow-left"></i>
                        <span>&lt; BACK TO QUEST ARCHIVE</span>
                    </button>

                    <!-- Sort Controls Bar (Visible on Grid View) -->
                    <div id="grid-controls-bar" class="grid-controls-bar">
                        <span class="sort-label">⚡ SORT BY:</span>
                        <div class="sort-buttons">
                            <button id="sort-recent" class="sort-btn active" onclick="setSortMode('recent')">RECENT</button>
                            <button id="sort-az" class="sort-btn" onclick="setSortMode('az')">A-Z</button>
                            <button id="sort-vols" class="sort-btn" onclick="setSortMode('vols')">VOLUMES ▼</button>
                        </div>
                    </div>
                </div>
                
                <!-- Dynamic Content Container -->
                <div id="book-list" class="dynamic-content">
                    <div class="connection-status">
                        <div class="spinner"></div>
                        <span class="pixel-blink">LOADING QUEST DATA...</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Script File -->
    <script src="./script.js"></script>
</body>
</html>
